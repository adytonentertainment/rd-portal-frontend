name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose deployment environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
jobs:
  Deploy:
    runs-on: ubuntu-latest
    env:
      ENV: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |

            # Start SSH agent and add deploy key
            eval "$(ssh-agent -s)"
            ssh-add root/.ssh/tunescan_deploy_key

            # Ensure swap is available for the build
            if [ ! -f /swapfile ]; then
              fallocate -l 4G /swapfile
              chmod 600 /swapfile
              mkswap /swapfile
            fi
            swapon /swapfile 2>/dev/null || true

            # Define target directory based on environment
            TARGET_DIR=/root/verax_frontend_${{ env.ENV }}

            # Clone or update repository
            if [ ! -d "$TARGET_DIR/" ]; then
              git clone git@github.com:Verax-UG/verax_frontend.git $TARGET_DIR
              cd $TARGET_DIR
              git checkout ${{ github.ref_name }}
            else
              cd $TARGET_DIR
              git fetch origin ${{ github.ref_name }}
              git reset --hard origin/${{ github.ref_name }}
            fi

            # Copy environment-specific secret file
            cp -Tv -f /root/secrets/frontend/.env.${{ env.ENV }} $TARGET_DIR/.env.production

            # Build
            npm install
            npm run build
      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cp -TRv /root/verax_frontend_${{ env.ENV }}/build /root/build_${{ env.ENV }}
            systemctl restart nginx
